        <nav class="toc" id="toc"></nav>
        <div class="side-note" id="sidenote">با انتخاب یک فایل MD شروع کن.</div>
      </aside>
      <main class="main">
        <section class="empty" id="empty"><div><div class="empty-brand">خوانا<span>.</span></div><h1>پژوهش را جور دیگری بخوان.</h1><p>گزارش‌های Markdown فارسی را با جدول‌های استاندارد، ارجاع‌های خوانا و جست‌وجوی سریع مرور کن.</p><button class="btn btn-primary" id="pickempty">انتخاب فایل Markdown</button><p class="drophint">یا فایل را با Drag & Drop وارد کن • پردازش محلی در مرورگر</p></div></section>
        <section class="empty" id="loading" hidden><div><div class="spinner"></div><h1>در حال آماده‌سازی سند</h1><p id="loadingtext">در حال خواندن فایل…</p></div></section>
        <div id="reader" hidden><header class="hero"><div class="hero-label">KHANA / RESEARCH DOCUMENT</div><h1 id="doctitle"></h1><div class="metrics" id="metrics"></div></header><article class="paper" id="paper"></article></div>
      </main>
    </div>
    <button class="to-top" id="totop" title="بازگشت به بالا" hidden>↑</button><div class="toast" id="toast" hidden></div>
  `;
  const paper=$('#paper');
  const toast = msg => {const el=$('#toast');el.textContent=msg;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2300)};
  const view = name => {for(const [id,mode] of [['empty','empty'],['loading','loading'],['reader','reader']]) $('#'+id).hidden=mode!==name;};
  const script = url => new Promise((res,rej)=>{const s=document.createElement('script');s.src=url;s.onload=res;s.onerror=()=>rej(new Error('بارگذاری کتابخانه ناموفق: '+url));document.head.append(s)});
  const baseLib = Promise.all([script(CDN+'marked@15.0.12/lib/marked.umd.js'),script(CDN+'dompurify@3.2.6/dist/purify.min.js')]);
  // Enhancements are deliberately optional: a CDN failure must never block the document.
  let enhancementsReady=false;
  const addons=baseLib.then(async()=>{await Promise.allSettled([
    script('https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js'),
    (async()=>{const link=document.createElement('link');link.rel='stylesheet';link.href=CDN+'katex@0.16.22/dist/katex.min.css';document.head.append(link);await script(CDN+'katex@0.16.22/dist/katex.min.js');await script(CDN+'katex@0.16.22/dist/contrib/auto-render.min.js')})()
  ]); enhancementsReady=true;if(!$('#reader').hidden) {applyOptional();isolateTechnicalText(paper);}}).catch(e=>console.warn(e));

  const choose = ()=>$('#file').click();$('#choose').onclick=choose;$('#pickempty').onclick=choose;
  $('#brand').onclick=e=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'})};
  $('#theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';document.documentElement.dataset.theme=state.theme;$('#theme').textContent=state.theme==='light'?'☾':'☀';};
  $('#print').onclick=()=>window.print();
  $('#plus').onclick=()=>{state.font=Math.min(21,state.font+1);paper.style.setProperty('--read-size',state.font+'px');};
  $('#minus').onclick=()=>{state.font=Math.max(13,state.font-1);paper.style.setProperty('--read-size',state.font+'px');};
  $('#focus').onclick=()=>{state.focus=!state.focus;document.body.classList.toggle('focus',state.focus);$('#focus').classList.toggle('toggled',state.focus);$('#focus').textContent=state.focus?'خروج از تمرکز':'تمرکز';};
  $('#width').onclick=()=>{state.wide=!state.wide;document.body.classList.toggle('wide',state.wide);$('#width').classList.toggle('toggled',state.wide);};
  $('#menu').onclick=()=>document.body.classList.toggle('drawer-open');$('#scrim').onclick=()=>document.body.classList.remove('drawer-open');
  $('#totop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  let sidebarTab='toc';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{sidebarTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderTOC();});
  $('#sidefilter').oninput=()=>renderTOC();

  async function copy(text,btn){const old=btn.textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style='position:fixed;opacity:0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('clipboard');t.remove();}btn.textContent='✓ کپی شد';setTimeout(()=>btn.textContent=old,1300)}catch(e){toast('مرورگر امکان کپی نداد');console.warn(e)}}
  function appendRefIndex(){if(!state.refs.size)return;const section=document.createElement('section');section.className='source-list';section.id='references';const title=document.createElement('h2');title.textContent='نمایه ارجاعات';const desc=document.createElement('p');desc.className='source-note';desc.textContent='شناسه‌های ChatGPT به شماره تبدیل شده‌اند. این شناسه‌ها به‌تنهایی URL اصلی منابع را در اختیار نمی‌گذارند؛ هیچ لینک ساختگی اضافه نشده است.';const grid=document.createElement('div');grid.className='source-grid';for(const [ref,num] of state.refs){const item=document.createElement('div');item.className='source-card';item.id='source-'+num;const name=document.createElement('b');name.textContent='['+num+'] ';const code=document.createElement('code');code.textContent=ref;item.append(name,code);grid.append(item)}section.append(title,desc,grid);paper.append(section)}
  function processCitations(){state.refs=new Map();const walk=document.createTreeWalker(paper,NodeFilter.SHOW_TEXT);const nodes=[];let n;while(n=walk.nextNode()){if(n.nodeValue.includes('\uE200cite\uE202')&&!n.parentElement?.closest('pre,code,script,style'))nodes.push(n)}for(const node of nodes){const src=node.nodeValue;CITE.lastIndex=0;const matches=[...src.matchAll(CITE)];if(!matches.length)continue;const frag=document.createDocumentFragment();let offset=0;for(const m of matches){frag.append(document.createTextNode(src.slice(offset,m.index)));const ids=m[1].split('\uE202').map(s=>s.trim()).filter(Boolean);const nums=ids.map(id=>{if(!state.refs.has(id))state.refs.set(id,state.refs.size+1);return state.refs.get(id)});const badge=document.createElement('button');badge.type='button';badge.className='citation';badge.textContent='['+nums.join(', ')+']';badge.title=ids.join('، ');badge.onclick=()=>{const el=$('#source-'+nums[0]);el?.scrollIntoView({behavior:'smooth',block:'center'});if(el){el.style.outline='2px solid var(--accent)';setTimeout(()=>el.style.outline='',1500)}};frag.append(badge);offset=m.index+m[0].length;}frag.append(document.createTextNode(src.slice(offset)));node.replaceWith(frag)}appendRefIndex()}
  function tableTSV(t){return [...t.rows].map(r=>[...r.cells].map(c=>c.innerText.replace(/\s+/g,' ').trim()).join('\t')).join('\n')}
  function enhance(){paper.querySelectorAll('a[href]').forEach(a=>{if(/^https?:/i.test(a.getAttribute('href'))){a.target='_blank';a.rel='noopener noreferrer'}});paper.querySelectorAll('img').forEach(i=>{i.loading='lazy';i.referrerPolicy='no-referrer'});
    paper.querySelectorAll('pre').forEach(pre=>{const code=pre.querySelector('code');if(!code)return;const raw=code.textContent;const lang=[...code.classList].find(c=>c.startsWith('language-'))?.slice(9)||'text';const wrap=document.createElement('div');wrap.className='codebox';const bar=document.createElement('div');bar.className='codebar';const label=document.createElement('span');label.textContent=lang.toUpperCase();const b=document.createElement('button');b.textContent='Copy code';b.onclick=()=>copy(raw,b);bar.append(label,b);pre.replaceWith(wrap);wrap.append(bar,pre)});
    paper.querySelectorAll('table').forEach((table,i)=>{const wrap=document.createElement('div');wrap.className='tablebox';const bar=document.createElement('div');bar.className='tablebar';const count=Math.max(0,table.rows.length-(table.tHead?.rows.length||0));const title=document.createElement('span');title.textContent='جدول '+fa(i+1)+'  ·  '+fa(count)+' ردیف × '+fa(table.rows[0]?.cells.length||0)+' ستون';const actions=document.createElement('span');actions.className='table-actions';const copyButton=document.createElement('button');copyButton.textContent='کپی برای Excel';copyButton.onclick=()=>copy(tableTSV(table),copyButton);const csvButton=document.createElement('button');csvButton.textContent='دریافت CSV';csvButton.onclick=()=>{const value=[...table.rows].map(r=>[...r.cells].map(c=>'"'+c.innerText.replace(/\s+/g,' ').trim().replace(/"/g,'""')+'"').join(',')).join('\r\n');const data=new Blob(['\ufeff'+value],{type:'text/csv;charset=utf-8;'});const u=URL.createObjectURL(data);const a=document.createElement('a');a.href=u;a.download='table-'+(i+1)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};actions.append(copyButton,csvButton);bar.append(title,actions);const scroll=document.createElement('div');scroll.className='table-scroll';table.replaceWith(wrap);wrap.append(bar,scroll);scroll.append(table);table.querySelectorAll('td,th').forEach(c=>{
        const val=c.textContent.trim();
        const letters=val.match(/[A-Za-z\u0621-\u064A\u066E-\u06D3\u06FA-\u06FF]/g)||[];
        const latin=letters.filter(ch=>/[A-Za-z]/.test(ch)).length;
        const persian=letters.length-latin;
        const first=letters[0]||'';
        // Numerical data and predominantly English technical cells read left-to-right;
        // Persian prose reads right-to-left, independently of alignment.
        c.dir=(latin>persian||(latin===persian&&/[A-Za-z]/.test(first))||
          (!letters.length&&/[0-9]/.test(val)))?'ltr':'rtl';
        if(/^[\s\d۰-۹.,+\-/%×:()]+$/.test(val)&&/[\d۰-۹]/.test(val))c.dataset.num='';
      });});processCitations();}
  /**
   * Protect Latin technical phrases (RTX 5090, Qwen3.8-27B, 31.4GiB,
   * CUDA/driver/runtime) from the Unicode bidirectional algorithm in RTL prose.
   * Works on rendered DOM; never alters underlying text, code, math, or citations.
   */
  function isolateTechnicalText(root) {
    const pattern = /[A-Za-z0-9][A-Za-z0-9._,\/:+#@%+\-\u2013\u00D7]*(?:[ \t\u00A0]+[A-Za-z0-9][A-Za-z0-9._,\/:+#@%+\-\u2013\u00D7]*)*/g;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(node) {
        const parent=node.parentElement;
        if (!parent || parent.closest('pre,code,script,style,svg,.katex,.katex-display,.citation,.tech-ltr,.source-list,.bookmark,.codebar,.tablebar,.search-mark')) {
          return NodeFilter.FILTER_REJECT;
        }
        if (!/[A-Za-z0-9]/.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
        // Do not split formulas before the optional KaTeX extension processes them.
        if (/\$|\\\(|\\\[/.test(node.nodeValue)) return NodeFilter.FILTER_REJECT;
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    const nodes=[];
    let node;
    while ((node=walker.nextNode())) nodes.push(node);
    for (const original of nodes) {
      const value=original.nodeValue;
      pattern.lastIndex=0;
      const matches=[...value.matchAll(pattern)];
      if (!matches.length) continue;
      const fragment=document.createDocumentFragment();
      let offset=0;
      for (const match of matches) {
        if (match.index>offset) fragment.append(document.createTextNode(value.slice(offset,match.index)));
        const span=document.createElement('bdi');
        span.className='tech-ltr';
        span.dir='ltr';
        span.lang='en';
        span.textContent=match[0];
        fragment.append(span);
        offset=match.index+match[0].length;
      }
      if (offset<value.length) fragment.append(document.createTextNode(value.slice(offset)));
      original.replaceWith(fragment);
    }
  }

  function applyOptional(){if(window.hljs)paper.querySelectorAll('pre code:not(.hljs)').forEach(code=>{try{window.hljs.highlightElement(code)}catch(e){console.warn(e)}});if(window.renderMathInElement)try{window.renderMathInElement(paper,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],throwOnError:false,ignoredTags:['script','noscript','style','textarea','pre','code']})}catch(e){console.warn(e)}}

  function renderTOC(){const q=fold($('#sidefilter').value.trim());const nav=$('#toc');nav.replaceChildren();const sections=state.sections.filter(s=>(sidebarTab==='toc'||state.bookmarks.has(s.id))&&(!q||fold(s.title).includes(q)));for(const s of sections){const a=document.createElement('a');a.href='#'+s.id;a.textContent=s.title;a.className='h'+s.level;if(s.id===state.active)a.classList.add('active');a.onclick=e=>{e.preventDefault();s.el.scrollIntoView({behavior:'smooth',block:'start'});document.body.classList.remove('drawer-open')};nav.append(a)}if(!sections.length){const p=document.createElement('div');p.style='padding:10px;color:var(--muted);font-size:11px';p.textContent=sidebarTab==='saved'?'هنوز بخشی را نشان نکرده‌ای.':'موردی پیدا نشد.';nav.append(p)}$('#headcount').textContent=fa(sections.length);}
  function buildTOC(){state.bookmarks.clear();state.sections=[...paper.querySelectorAll('h1,h2,h3,h4')].filter(e=>!e.closest('.source-list')&&!e.hidden).map((el,i)=>{const title=el.textContent.trim(),id='section-'+(i+1),level=Number(el.tagName.slice(1));el.id=id;const btn=document.createElement('button');btn.className='bookmark';btn.textContent='☆';btn.title='نشان‌کردن این بخش';btn.setAttribute('aria-label','نشان‌کردن '+title);btn.onclick=()=>{if(state.bookmarks.has(id))state.bookmarks.delete(id);else state.bookmarks.add(id);btn.classList.toggle('active',state.bookmarks.has(id));btn.textContent=state.bookmarks.has(id)?'★':'☆';renderTOC();toast(state.bookmarks.has(id)?'بخش نشان شد':'نشان برداشته شد')};el.append(btn);return {title,id,level,el}});state.active=state.sections[0]?.id||'';renderTOC();}
  let scrollPending=false;function onScroll(){if(scrollPending)return;scrollPending=true;requestAnimationFrame(()=>{scrollPending=false;if($('#reader').hidden)return;let active=state.sections[0]?.id||'';for(const s of state.sections){if(s.el.getBoundingClientRect().top<145)active=s.id}if(active!==state.active){state.active=active;renderTOC()}const top=paper.getBoundingClientRect().top+scrollY;const max=Math.max(1,paper.offsetHeight-innerHeight+120);$('#progress').style.width=Math.max(0,Math.min(100,100*(scrollY-top+100)/max))+'%';$('#totop').hidden=scrollY<420;})};addEventListener('scroll',onScroll,{passive:true});

  function clearSearch(){paper.querySelectorAll('mark.search-mark').forEach(mark=>{const p=mark.parentNode;mark.replaceWith(document.createTextNode(mark.textContent));p?.normalize()});state.hits=[];state.hit=-1;$('#searchcount').textContent='';}
  function selectHit(i){if(!state.hits.length)return;state.hits[state.hit]?.classList.remove('current');state.hit=(i+state.hits.length)%state.hits.length;const hit=state.hits[state.hit];hit.classList.add('current');hit.scrollIntoView({behavior:'smooth',block:'center'});$('#searchcount').textContent=fa(state.hit+1)+'/'+fa(state.hits.length);}
  function searchText(){clearSearch();const term=fold($('#search').value.trim());if(!term||$('#reader').hidden)return;const walk=document.createTreeWalker(paper,NodeFilter.SHOW_TEXT,{acceptNode(node){const parent=node.parentElement;if(!parent||parent.closest('pre,code,script,style,.katex,.citation,.codebar,.tablebar,.bookmark,.source-list'))return NodeFilter.FILTER_REJECT;return fold(node.nodeValue).includes(term)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});const nodes=[];let n;while(n=walk.nextNode())nodes.push(n);let count=0;for(const node of nodes){const raw=node.nodeValue,normalized=fold(raw);const frag=document.createDocumentFragment();let from=0,pos;while((pos=normalized.indexOf(term,from))!==-1&&count<300){frag.append(document.createTextNode(raw.slice(from,pos)));const mark=document.createElement('mark');mark.className='search-mark';mark.textContent=raw.slice(pos,pos+term.length);frag.append(mark);state.hits.push(mark);from=pos+term.length;count++}frag.append(document.createTextNode(raw.slice(from)));node.replaceWith(frag);if(count>=300)break;}if(state.hits.length)selectHit(0);else $('#searchcount').textContent='۰ نتیجه';}
  let searchTimer;$('#search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(searchText,170)};$('#nexthit').onclick=()=>selectHit(state.hit+1);$('#prevhit').onclick=()=>selectHit(state.hit-1);
  document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#search').focus();$('#search').select()}else if(e.key==='Escape'){document.body.classList.remove('drawer-open');if(document.activeElement===$('#search')){$('#search').value='';clearSearch();$('#search').blur()}}else if(document.activeElement===$('#search')&&e.key==='Enter'){e.preventDefault();selectHit(state.hit+(e.shiftKey?-1:1))}});

  async function openFile(file){if(!file||state.busy)return;if(!/\.(md|markdown|txt)$/i.test(file.name)&&!file.type.startsWith('text/')){toast('لطفاً یک فایل Markdown انتخاب کن');return;}state.busy=true;$('#choose').disabled=true;const previous=!$('#reader').hidden;if(!previous)view('loading');else toast('در حال بازکردن سند جدید…');try{const raw=await file.text();$('#loadingtext').textContent='در حال ساخت نمای سند…';await baseLib;const result=window.marked.parse(raw,{gfm:true,breaks:false});const html=window.DOMPurify.sanitize(await result);const tmp=document.createElement('article');tmp.innerHTML=html;paper.replaceChildren(...tmp.childNodes);enhance();if(enhancementsReady)applyOptional();isolateTechnicalText(paper);const docHeading=paper.querySelector('h1');const docTitle=docHeading?.textContent?.trim()||paper.querySelector('h2')?.textContent?.trim()||file.name.replace(/\.[^.]+$/,'');if(docHeading===paper.firstElementChild)docHeading.hidden=true;buildTOC();state.file=file;$('#doctitle').textContent=docTitle;$('#filename').textContent=file.name;document.title=$('#doctitle').textContent+' · خوانا';const words=raw.trim()?raw.trim().split(/\s+/).length:0;const metrics=[fa(words)+' واژه',fa(state.sections.length)+' سرفصل',fa(paper.querySelectorAll('table').length)+' جدول',fa(state.refs.size)+' ارجاع','زمان مطالعه حدود '+fa(Math.max(1,Math.ceil(words/190)))+' دقیقه'];$('#metrics').replaceChildren(...metrics.map(t=>{const s=document.createElement('span');s.className='metric';s.textContent=t;return s}));$('#sidenote').textContent='برای نشان‌کردن یک بخش، ستاره کنار عنوان آن را انتخاب کن.';$('#choose').textContent='تغییر سند';$('#sidefilter').value='';$('#search').value='';clearSearch();sidebarTab='toc';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab==='toc'));renderTOC();view('reader');window.scrollTo({top:0,behavior:'instant'});onScroll();toast('سند آماده مطالعه است ✓')}catch(e){console.error(e);if(!previous)view('empty');toast('خطا: '+e.message)}finally{state.busy=false;$('#choose').disabled=false;}};
  $('#file').onchange=e=>{const file=e.target.files?.[0];e.target.value='';openFile(file)};
  let dragDepth=0;document.addEventListener('dragenter',e=>{if(e.dataTransfer?.types.includes('Files')){e.preventDefault();dragDepth++;$('#drop').hidden=false}});document.addEventListener('dragover',e=>{if(e.dataTransfer?.types.includes('Files'))e.preventDefault()});document.addEventListener('dragleave',e=>{if(e.dataTransfer?.types.includes('Files')){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$('#drop').hidden=true}});document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;$('#drop').hidden=true;openFile(e.dataTransfer?.files?.[0])});
  // Avoid unhandled rejections if the user only opens the app and never selects a file.
  baseLib.catch(e=>{console.warn(e);toast('اتصال CDN برقرار نشد؛ اینترنت و فیلترشکن را بررسی کن')});
})();
